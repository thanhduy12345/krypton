name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --console=plain > build.log 2>&1
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-and-jar
          path: |
            build.log
            build/libs/*.jar
